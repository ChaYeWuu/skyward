[device]
codename = "shennong"
brand = "Xiaomi"
model = "Xiaomi 14 Pro"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, persist.sys.miui_default_resolution in the odm
# partition's build.prop and the n2 panels' mode in the device tree:
# 1440 by 3200. persist.sys.miui_resolution gives the lower mode the system
# starts in, 1080 by 2400 at 420, as the 13 Ultra's does; the density is
# that one's, at the panel's own width, as the 13 Ultra's is.
width = 1440
height = 3200
density = 560

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI behind Xiaomi's touch
# layer, the one touch driver the phone's own modules.load lists.
load = ["synaptics_tcm2"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key. The
# init script asks a notify-topology socket of it, which init makes and
# hands over as a file descriptor.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]
sockets = [{ name = "notify-topology", kind = "stream", mode = 0o660, user = "system", group = "drmrpc" }]

# ssgtzd registers TA autoload/opener services with the secure world. As
# on the 15, leaving it out keeps the credential services from working.
[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]
sockets = [
    { name = "ssgtzd", kind = "stream", mode = 0o660, user = "system", group = "oem_2912" },
    { name = "ssgtzd_opener", kind = "stream", mode = 0o660, user = "system", group = "system" },
]

# The key service, which is the only thing that can use the keys the phone
# wrapped in hardware. The same program serves the secure clock and the
# shared secret, which the phone describes apart from it.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
# The VNDK bundle holds the dmabuf and hardware libraries the phone's
# partitions were built against, together with the libc++ they were built
# against; the system partition's own copies need a libc++ the recovery
# does not carry, and preloading one breaks the caller's own.
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64", "/mnt/system/system/lib64/bootstrap", "/apex/com.android.vndk.v34/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# The credential service: it is what the secure world has check a screen
# lock, and the only thing that can hand out the note the key service wants
# before it will use a key a screen lock guards. The AIDL kind, as the
# phone's vendor.gatekeeper.is_security_level_spu is 0.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/mnt/system/system/lib64/bootstrap", "/apex/com.android.vndk.v34/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

# The weaver, in the phone's NXP secure element. Every user's secret is
# bound to a slot of it, with a screen lock or without. Its account is the
# one the vendor partition's passwd file gives, as the phone's own init
# script asks.
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.nxp-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64/bootstrap", "/apex/com.android.vndk.v34/lib64"]
ready_service = "android.hardware.weaver.IWeaver/default"
user = "vendor_nxp_weaver"
groups = ["system", "drmrpc"]

# The boot control, which says which slot the bootloader starts next and
# switches it, writing where the bootloader reads it. It comes last: the
# phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one WLAN driver the phone's own modules.blocklist leaves of those its
# modules.load lists. Its cfg80211 asks for rfkill, one of the kernel's own
# modules in system_dlkm, as the 17 Ultra's does. The firmware loader finds
# the driver's images in /vendor/firmware_mnt/image/kiwi, which the
# kernel's own firmware_class.path names and the recovery mounts, so no
# file of them is given here. This phone's persist keeps no wlan_mac.bin;
# as on the 15, the driver obtains its address without it.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.309.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.309.0.WNBCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.309.0.WNBCNXM/shennong-ota_full-OS3.0.309.0.WNBCNXM-user-16.0-ab2b836306.zip"
recovery = "2a07b87f0a09ec8e75155aa9d36df354de09d77332cf56caf97659878e91e368"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
